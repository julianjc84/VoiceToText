[package]
name = "voice-to-text"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "System-wide voice-to-text dictation tool for Linux"

[dependencies]
whisper-rs = "0.13"
cpal = "0.15"
crossbeam-channel = "0.5"
arboard = "3"
tray-icon = "0.19"
muda = "0.15"
zbus = "4"
ureq = "2"
ten-vad-rs = "0.1.5"
gtk = "0.18"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
global-hotkey = "0.7"
png = "0.17"
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
evdev = "0.12"
libc = "0.2"

[package.metadata.deb]
maintainer = "Julian"
section = "utils"
priority = "optional"
depends = "libasound2, libgtk-3-0, libxdo3"
recommends = "xdotool, xclip"
suggests = "wtype, ydotool, wl-clipboard"
assets = [
    ["target/release/voice-to-text", "usr/bin/", "755"],
    ["voice-to-text.desktop", "usr/share/applications/", "644"],
    ["assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/voice-to-text.png", "644"],
]

[profile.release]
opt-level = 3
lto = "thin"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Allow-list for pedantic lints that produce excessive noise with low value.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
uninlined_format_args = "allow"   # many existing eprintln!()s
cast_possible_truncation = "allow" # audio sample / chunk size casts are intentional
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
similar_names = "allow"
too_many_lines = "allow"
doc_markdown = "allow"
unreadable_literal = "allow"
# False positive for thread-worker functions that own a Sender/Receiver
# half but only call &self-receiving methods like .send()/.recv() in
# the body (clippy doesn't see the channel as consumed).
needless_pass_by_value = "allow"
# main.rs's start_recording / stop_recording coordinator helpers have
# 8-11 args; refactoring into a Context struct is a larger change and
# out of scope for this pass.
too_many_arguments = "allow"
